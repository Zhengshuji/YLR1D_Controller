# ==================== 雷达 ====================
# 360° 单层 ray，2770 线，等效激光雷达
radar_sensor:
  type: ray
  link: Link_RadarSensor
  update_rate: 12
  topic: /radar/scan
  ray:
    scan:
      horizontal:
        samples: 2770
        resolution: 1
        min_angle: -3.14159
        max_angle: 3.14159
    range:
      min: 0.1
      max: 30.0
      resolution: 0.01
  noise:
    mean: 0.0
    stddev: 0.01

# ==================== IMU ====================
imu_sensor:
  type: imu
  link: Link_IMUSensor
  update_rate: 116
  topic: /imu_data
  noise:
    mean: 0.0
    stddev: 0.01

# ==================== 超声波（4 个）====================
# 单线 ray 模拟声呐，水平张角 ±0.5236 rad
lf_ultrasonic_sensor:
  type: ray
  link: Link_LFUltrasonicSensor
  update_rate: 20
  topic: /lf_ultrasonic/range
  ray:
    scan:
      horizontal:
        samples: 1
        resolution: 1
        min_angle: -0.5236
        max_angle: 0.5236
    range:
      min: 0.25
      max: 4.5
      resolution: 0.01

