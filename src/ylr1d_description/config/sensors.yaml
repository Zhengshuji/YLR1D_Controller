# 传感器统一配置（单一来源）
# =========================================================
# ylr1d_description 的传感器参数集中在本文件，替代原先零散的
# config/sensors/*.yaml 子目录。ylr1d.xacro 通过
# ${sensors.<id>.<param>} 引用（由 launch 的 xacro_utils.py
# 预替换为字面量后再展开）。
#
# 取值以 ylr1d.xacro 中实际生效值为准。
# =========================================================

# ==================== 相机 ====================
# 每组相机（rgb / depth / infrared）挂在同一个相机 link 上。
# plugin.camera_name 决定 libgazebo_ros_camera.so 的话题命名空间。

# ---- 全局相机 GlobalCameraSensor ----
global_rgb_camera:
  type: camera
  link: Link_GlobalCameraSensor
  update_rate: 30
  topic: /global_camera/rgb/image_raw
  camera:
    horizontal_fov: 1.047
    image:
      width: 1920
      height: 1080
      format: R8G8B8
    clip:
      near: 0.1
      far: 100.0
  plugin:
    camera_name: global_camera/rgb

global_depth_camera:
  type: depth
  link: Link_GlobalCameraSensor
  update_rate: 30
  topic: /global_camera/depth/image_raw
  camera:
    horizontal_fov: 1.047
    image:
      width: 640
      height: 480
      format: R8G8B8
    clip:
      near: 0.2
      far: 4.0
  plugin:
    camera_name: global_camera/depth

global_infrared_camera:
  type: camera
  link: Link_GlobalCameraSensor
  update_rate: 15
  topic: /global_camera/infrared/image_raw
  camera:
    horizontal_fov: 1.047
    image:
      width: 640
      height: 480
      format: R8G8B8
    clip:
      near: 0.1
      far: 10.0
  plugin:
    camera_name: global_camera/infrared

