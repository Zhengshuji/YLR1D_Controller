# 位置控制关节的限制参数（26 个位置接口关节）
# 结构: <关节名>: {limit: {lower, upper, velocity, accelerate}}
# 该文件经 launch 加载后映射为 ROS2 参数: <关节名>/limit/<参数名>
# 单位: 旋转关节 rad, 棱柱关节 m (Joint_Base_to_Body1, 夹爪), 速度 rad/s, 加速度 rad/s^2

