# 全部 30 个关节的独立 PID 参数
# 结构: <关节名>: {pid: {kp, ki, kd}}
# 该文件经 launch 加载后映射为 ROS2 参数: <关节名>/pid/<参数名>
# 位置关节: PID 输出加速度 -> 速度 -> 位置；速度关节(轮子): PID 输出加速度 -> 速度

# ── 转向（位置接口） ──
Joint_Base_to_RFWheelF:
  pid:
    kp: 150.0
    ki: 0.0
    kd: 20.0
Joint_Base_to_LFWheelF:
  pid:
    kp: 150.0
    ki: 0.0
    kd: 20.0
Joint_Base_to_RBWheelF:
  pid:
    kp: 150.0
    ki: 0.0
    kd: 20.0
Joint_Base_to_LBWheelF:
  pid:
    kp: 150.0
    ki: 0.0
    kd: 20.0

# ── 轮子（速度接口） ──
Joint_RFWheelF_to_RFWheel:
  pid:
    kp: 4.0
    ki: 0.0
    kd: 0.1
Joint_LFWheelF_to_LFWheel:
  pid:
    kp: 4.0
    ki: 0.0
    kd: 0.1
Joint_RBWheelF_to_RBWheel:
